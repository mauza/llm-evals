[project]
name = "llm-evals"
version = "0.1.0"
description = "Personal, versioned LLM tests/benchmarks with a runner and self-contained run artifacts"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pyyaml>=6.0",
]

[project.scripts]
llm-evals = "harness.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]
